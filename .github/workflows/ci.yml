name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: python -m ruff check .

      - name: Compile
        run: python -m compileall -q main.py ui.py converters.py converters_legacy.py cpp_bridge.py self_test.py version.py

      - name: Registry tests
        run: python -m unittest discover -s tests -v

  cpp:
    # C++ 核心的构建检查。用 windows-2022 而不是 windows-latest：
    # 新的 windows-2025 镜像里 CMake 找不到 Visual Studio 实例。
    # 真实发布用本地 Zig 工具链构建，这里失败也不阻塞发布。
    continue-on-error: true
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download PDFium
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8138/pdfium-win-x64.tgz" -OutFile pdfium-win-x64.tgz
          New-Item -ItemType Directory -Force -Path cpp/third_party/pdfium-win | Out-Null
          tar -xzf pdfium-win-x64.tgz -C cpp/third_party/pdfium-win

      - name: Configure
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFC_PDFIUM_DIR="$PWD/cpp/third_party/pdfium-win"

      - name: Build
        run: cmake --build cpp/build --parallel

      - name: Smoke test
        run: |
          .\cpp\build\fccli.exe --version
          .\cpp\build\fccli.exe list | Out-Null