name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: python -m ruff check .

      - name: Compile
        run: python -m compileall -q main.py ui.py converters.py converters_legacy.py cpp_bridge.py self_test.py version.py

      - name: Registry tests
        run: python -m unittest discover -s tests -v

  cpp:
    # C++ 核心的构建检查：不同 Windows 镜像的 MSVC/CMake 版本差异偶尔会让这一步
    # 变红，但它不是发布阻塞项（真实发布用本地 Zig 工具链构建），因此允许失败。
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PDFium
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8138/pdfium-win-x64.tgz" -OutFile pdfium-win-x64.tgz
          New-Item -ItemType Directory -Force -Path cpp/third_party/pdfium-win | Out-Null
          tar -xzf pdfium-win-x64.tgz -C cpp/third_party/pdfium-win

      - name: Configure
        run: cmake -S cpp -B cpp/build -G "Visual Studio 17 2022" -A x64 -DFC_PDFIUM_DIR="$PWD/cpp/third_party/pdfium-win"

      - name: Build
        run: cmake --build cpp/build --config Release --parallel

      - name: Smoke test
        run: |
          .\cpp\build\Release\fccli.exe --version
          .\cpp\build\Release\fccli.exe list | Out-Null