name: 功能建议
description: 希望支持的新格式、新交互或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。说清楚「在什么场景下、想省掉哪一步」比只说「加个功能」更容易实现。

  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 你当时想做什么？现在要绕几步？
      placeholder: 我经常把手机拍的 HEIC 批量转成 JPG 发群里，现在每次都要先……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望的做法
      placeholder: 希望在「图片」卡片里直接有一个「转 JPG 并压到 2 MB 以内」的预设
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你目前怎么绕过去的
    validations:
      required: false
