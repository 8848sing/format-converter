[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-converter"
dynamic = ["version"]
description = "Portable Windows batch format converter for images, PDF, Office documents, audio/video and structured data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "8848sing" }]
keywords = ["windows", "android", "converter", "pdf", "image", "cpp", "cmake", "ffmpeg", "libreoffice", "tkinter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/8848sing/format-converter"
Issues = "https://github.com/8848sing/format-converter/issues"
Releases = "https://github.com/8848sing/format-converter/releases"
Changelog = "https://github.com/8848sing/format-converter/blob/main/README.zh-CN.md#更新日志"

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["build", "dist", "tools", "cpp/build", "cpp/third_party", "cpp/android/.gradle", "cpp/android/app/build"]

[tool.ruff.lint]
select = ["E9", "F"]